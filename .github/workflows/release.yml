name: Release

on:
  push:
    tags: ["v*"]
  # Manual trigger: cuts a whole release in one action. Creates the tag if
  # it does not exist yet, then builds and attaches the bundle — so a
  # release never depends on doing UI steps in a particular order. Also
  # repairs an existing release that is missing its download.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1). Created if it does not exist."
        required: true
      ref:
        description: "Branch or commit to tag when creating a new tag."
        required: false
        default: main

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so existing tags are available to resolve against.
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve or create the release tag
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            # Build exactly what the tag points at, not whatever the run
            # was dispatched from.
            echo "Tag $RELEASE_TAG exists — building from it."
            git checkout --detach "refs/tags/$RELEASE_TAG"
          else
            echo "Tag $RELEASE_TAG does not exist — creating it at $(git rev-parse --short HEAD)."
            # Runners have no git identity; annotated tags need one.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "vizz $RELEASE_TAG"
            # A tag pushed with GITHUB_TOKEN does not re-trigger workflows,
            # so this run stays the only build for the tag.
            git push origin "$RELEASE_TAG"
          fi
      - name: Detect signing configuration
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "HAVE_CERT=true" >> "$GITHUB_ENV"
            echo "Developer ID present — the bundle will be signed and notarized."
          else
            echo "HAVE_CERT=false" >> "$GITHUB_ENV"
            echo "::warning::No APPLE_CERT_P12 secret — publishing an ad-hoc signed bundle; first launch will need right-click → Open."
          fi

      - name: Ensure Rust
        run: command -v cargo >/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      # Import the Developer ID into a throwaway keychain. Skipped
      # entirely when the secret is absent, so the workflow keeps working
      # before the certificate exists and for forks that will never have
      # it — the bundle is simply ad-hoc signed as before.
      - name: Import signing certificate
        if: ${{ env.HAVE_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # A random password on an ephemeral keychain: it exists for the
          # length of this job and is discarded with the runner.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build vizz.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.HAVE_CERT == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: ./scripts/make-app.sh

      # Notarize and staple. Stapling matters: without it the bundle needs
      # a network round-trip to Apple on first launch, which at a venue
      # with no wifi is exactly the failure this is meant to remove.
      - name: Notarize and staple
        if: ${{ env.HAVE_CERT == 'true' }}
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          # Notarization takes a zip; the stapled result goes back onto the
          # .app itself, which is what ships.
          ditto -c -k --keepParent dist/vizz.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/key.p8"
          xcrun stapler staple dist/vizz.app

          # The check that actually proves the right-click step is gone.
          # codesign --verify only says the signature is well formed;
          # spctl asks the question Gatekeeper will ask on a user machine.
          xcrun stapler validate dist/vizz.app
          spctl -a -vvv -t install dist/vizz.app

          # Re-zip so the published asset is the stapled bundle, not the
          # pre-notarization one.
          rm -f dist/vizz.app.zip
          ditto -c -k --keepParent dist/vizz.app dist/vizz.app.zip

      # Compiling is not evidence that it runs. Launch the binary that is
      # actually inside the bundle and make it render: a build that dies on
      # startup would otherwise publish clean and pass the asset check,
      # and the first person to find out would be someone downloading it.
      - name: Smoke-test the bundled binary
        run: |
          BIN="dist/vizz.app/Contents/MacOS/vizz"
          test -x "$BIN" || { echo "::error::no executable at $BIN"; exit 1; }

          # Version must match the tag, or the update banner nags every
          # user about a release they are already running.
          want="${RELEASE_TAG#v}"; want="${want%%-*}"
          got=$("$BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$got" != "$want" ]; then
            echo "::error::bundle reports version $got but the tag is $RELEASE_TAG"
            exit 1
          fi

          # Audio deliberately left enabled: it is on by default for real
          # users, and opening an input is exactly where a missing
          # Info.plist usage description kills the app. CI runners have no
          # input device, so this exercises the fail-soft path.
          "$BIN" --headless --frames 30 --width 320 --height 180 \
                 --no-update-check --no-syphon \
                 --report smoke.json
          python3 - smoke.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          fps = d.get("health", {}).get("fps", 0)
          assert d.get("frames_requested") == 30, d
          assert fps > 0, f"fps was {fps}"
          print(f"smoke: rendered 30 frames at {fps:.1f} fps")
          PY
      # Attach the bundle whether or not the release already exists: a
      # release published from the GitHub UI creates the tag itself, which
      # triggers this workflow, so `gh release create` would fail on an
      # already-existing release and leave it with no download.
      - name: Publish app bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="macOS app bundle with Syphon embedded. First launch: right-click → Open (unsigned). Appears in Resolume/VDMX as Syphon source 'vizz'; OSC control on udp/7000."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists — uploading bundle to it."
            gh release upload "$RELEASE_TAG" dist/vizz.app.zip --clobber
          else
            echo "Creating release $RELEASE_TAG with bundle."
            gh release create "$RELEASE_TAG" dist/vizz.app.zip \
              --title "vizz $RELEASE_TAG" \
              --generate-notes \
              --notes "$notes"
          fi
          # Fail loudly if the asset somehow did not land — a release with
          # no download silently breaks scripts/install.sh.
          gh release view "$RELEASE_TAG" --json assets \
            | grep -q "vizz.app.zip" \
            || { echo "::error::vizz.app.zip missing from release $RELEASE_TAG"; exit 1; }
          echo "vizz.app.zip published to release $RELEASE_TAG."
