name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Rust
        run: command -v cargo >/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      - name: Build vizz.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/make-app.sh
      - name: Create release with app bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/vizz.app.zip \
            --title "vizz $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "macOS app bundle with Syphon embedded. First launch: right-click → Open (unsigned). Appears in Resolume/VDMX as Syphon source 'vizz'; OSC control on udp/7000."
