name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual trigger: re-run the full check suite (including the real-Metal
  # Syphon test) and rebuild the vizz.app artifact on demand, without
  # needing an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      # Fail rather than silently skip if the GPU tests find no adapter.
      VIZZ_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Rust
        run: command -v cargo >/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      # lavapipe: a software rasterizer, since runners have no GPU or
      # Vulkan ICD — enough for the readback ring and the NDI data path.
      # libasound2-dev: midir needs ALSA headers on Linux (macOS and
      # Windows use CoreMIDI/WinMM and need nothing).
      - name: Install Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libasound2-dev
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Verify NDI ABI against stub
        run: ./scripts/test-ndi-abi.sh

  # Nothing in this codebase had ever been compiled on Windows. Spout is
  # the remaining output gap and it cannot be written responsibly without
  # a build gate on the platform it targets — and a Windows job earns its
  # keep before Spout exists, because every dependency here (cpal on
  # WASAPI, midir on WinMM, wgpu on DX12) takes a different path there.
  #
  # GPU tests are required rather than allowed to skip, for the same
  # reason they are on the other two: a silently skipped GPU test looks
  # exactly like a passing one. Windows runners expose WARP, D3D12's
  # software rasterizer, which is enough for the readback ring.
  windows:
    runs-on: windows-latest
    env:
      VIZZ_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      # The NDI ABI stub is not run here yet: it builds a shared library
      # with `cc -shared -fPIC` into a .so/.dylib, which needs a separate
      # MSVC path to produce a .dll. Worth doing — the struct layout that
      # test pins is exactly the sort of thing that differs on Windows —
      # but it is its own change.

  # Real Apple Silicon with working Metal: this exercises the actual
  # Syphon publish path end-to-end, not just a compile check.
  macos:
    runs-on: macos-latest
    env:
      VIZZ_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Rust
        run: command -v cargo >/dev/null || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH")
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Verify NDI ABI against stub
        run: ./scripts/test-ndi-abi.sh
      - name: Fetch Syphon.framework
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-syphon.sh vendor
      - name: Headless run with Syphon on real Metal
        run: |
          RUST_LOG=info cargo run -- --headless --frames 120 \
            --report bench-macos.json --dump frame-macos.png 2> run.log \
            || { cat run.log; exit 1; }
          cat run.log
          grep -q "Syphon output 'vizz' is live" run.log \
            || { echo "::error::Syphon server did not start — see run.log"; exit 1; }
          if grep -q "output 'vizz' failed" run.log; then
            echo "::error::Syphon publish failed mid-run — see run.log"; exit 1
          fi
          echo "Syphon server started and published 120 frames."
      - name: Upload benchmark + frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-headless
          path: |
            bench-macos.json
            frame-macos.png
            run.log
          if-no-files-found: ignore
      - name: Build vizz.app bundle
        run: ./scripts/make-app.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: vizz.app
          path: dist/vizz.app.zip
