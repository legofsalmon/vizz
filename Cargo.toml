[workspace]
resolver = "3"
members = [
    "crates/vizz-params",
    "crates/vizz-osc",
    "crates/vizz-health",
    "crates/vizz-render",
    "crates/vizz-io",
    "crates/vizz-midi",
    "crates/vizz-mod",
    "crates/vizz-audio",
    "crates/vizz-design",
    "crates/vizz-ui",
    "crates/vizz-update",
    "crates/vizz-app",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/legofsalmon/vizz"

[workspace.dependencies]
vizz-params = { path = "crates/vizz-params" }
vizz-osc = { path = "crates/vizz-osc" }
vizz-health = { path = "crates/vizz-health" }
vizz-render = { path = "crates/vizz-render" }
vizz-io = { path = "crates/vizz-io" }
vizz-midi = { path = "crates/vizz-midi" }
vizz-mod = { path = "crates/vizz-mod" }
vizz-audio = { path = "crates/vizz-audio" }
vizz-design = { path = "crates/vizz-design" }
vizz-ui = { path = "crates/vizz-ui" }
vizz-update = { path = "crates/vizz-update" }

anyhow = "1"
log = "0.4"
env_logger = "0.11"
wgpu = "30"
winit = "0.30"
egui = "0.35"
egui-winit = { version = "0.35", default-features = false, features = ["links", "wayland", "x11"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
rosc = "0.11"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Text-to-cloud rasterizing. Already in the build via egui/epaint, so
# naming them directly costs nothing new.
ab_glyph = "0.2"
epaint_default_fonts = "0.35"
# 0.39 needs rustc 1.95; stay one minor back until the toolchain catches up.
sysinfo = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rustfft = "6"
glam = { version = "0.30", features = ["bytemuck"] }

# Fast enough to iterate, realistic enough to judge frame times.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
