[package]
name = "vizz-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
anyhow.workspace = true
# Free space on the recording volume: a take that fills the disk is the
# one failure here that costs something outside the app.
sysinfo.workspace = true
log.workspace = true
# NDI is loaded at runtime on every platform, so this is not target-gated.
libloading = "0.8"
# PNG encoding for the recorder.
image.workspace = true
# ST 2110 output: SMPTE ST 2110-20 video on ordinary UDP sockets, paced on
# the SMPTE Epoch. From vizz's sibling repository, which publishes no
# releases, so pinned to a commit.
st2110-media = { git = "https://github.com/legofsalmon/st2110", rev = "1115628a36ddbf54e1cfcd0fb5b0f9a704eaa64f", features = ["net"] }
st2110-ptp = { git = "https://github.com/legofsalmon/st2110", rev = "1115628a36ddbf54e1cfcd0fb5b0f9a704eaa64f" }

[dev-dependencies]
pollster.workspace = true

# objc2 version must stay in sync with wgpu-hal's, so the
# ProtocolObject types returned by wgpu's Metal HAL unify with ours.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
