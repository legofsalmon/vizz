[package]
name = "vizz-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
anyhow.workspace = true
log.workspace = true

# objc2 version must stay in sync with wgpu-hal's, so the
# ProtocolObject types returned by wgpu's Metal HAL unify with ours.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
libloading = "0.8"
