[package]
name = "vizz-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
anyhow.workspace = true
# Free space on the recording volume: a take that fills the disk is the
# one failure here that costs something outside the app.
sysinfo.workspace = true
log.workspace = true
# NDI is loaded at runtime on every platform, so this is not target-gated.
libloading = "0.8"
# PNG encoding for the recorder.
image.workspace = true

[dev-dependencies]
pollster.workspace = true

# objc2 version must stay in sync with wgpu-hal's, so the
# ProtocolObject types returned by wgpu's Metal HAL unify with ours.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
