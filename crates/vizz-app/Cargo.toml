[[bin]]
name = "vizz"
path = "src/main.rs"

[dependencies]
vizz-params.workspace = true
vizz-osc.workspace = true
vizz-health.workspace = true
vizz-render.workspace = true
vizz-io.workspace = true
vizz-midi.workspace = true
vizz-mod.workspace = true
vizz-audio.workspace = true
vizz-ui.workspace = true
vizz-update.workspace = true

anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
clap.workspace = true
image.workspace = true
ab_glyph.workspace = true
epaint_default_fonts.workspace = true
serde.workspace = true
serde_json.workspace = true

# Camera and capture-card input, macOS only. Capture is a delegate
# protocol, a session lifecycle and a pile of pixel formats; a
# maintained crate that handles all of it beats interop written blind,
# and gating it here keeps every other platform's build untouched.
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }
